
services:
  db:
    image: postgres:16
    container_name: tokopedia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tokopedia_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tokopedia_dw"]
      interval: 10s
      timeout: 5s
      retries: 5

  etl:
    build: .
    container_name: tokopedia_etl
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tokopedia_dw
      DB_USER: postgres
      DB_PASSWORD: ${DOCKER_DB_PASSWORD}
    volumes:
      - ./data:/app/data
    command: python main.py

volumes:
  postgres_data:
